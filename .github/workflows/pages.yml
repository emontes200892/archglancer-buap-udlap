name: Publicar ArchGlancer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Esperar disponibilidad del paquete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/actions/runs/' + os.environ['GH_RUN_ID'] + '/artifacts?per_page=100'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'ArchGlancer-deploy'}
          for attempt in range(30):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                  artifacts = json.load(response)['artifacts']
              matching = [a for a in artifacts if a['name'] == os.environ['GH_ARTIFACT_NAME'] and not a['expired']]
              if len(matching) == 1:
                  print('Paquete disponible para publicar.')
                  break
              if len(matching) > 1:
                  raise SystemExit('Paquetes duplicados; no se publica un resultado ambiguo.')
              time.sleep(3)
          else:
              raise SystemExit('GitHub aún no expone el paquete de publicación. Reintenta el workflow.')
          PY
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
